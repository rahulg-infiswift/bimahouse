name: bimahouse
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # Override any environment variables if needed
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/policydb
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: policy-extract
      STORAGE_DIR: /app/storage/pdfs
      ALLOW_DEV_USER_HEADER: "false"
    volumes:
      - ./backend/backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # Override any environment variables if needed
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/policydb
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: policy-extract
      STORAGE_DIR: /app/storage/pdfs
      ALLOW_DEV_USER_HEADER: "false"
    volumes:
      - ./backend/backend_storage:/app/storage
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  pgdata:
