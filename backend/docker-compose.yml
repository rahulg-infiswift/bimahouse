name: bimahouse
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override any environment variables if needed
      ENV: dev
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/policydb
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: policy-extract
      STORAGE_DIR: /app/storage/pdfs
      OPENAI_MODEL: gpt-5-nano
      ALLOW_DEV_USER_HEADER: "true"
    volumes:
      - ./backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    env_file:
      - .env
    environment:
      # Override any environment variables if needed
      ENV: dev
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/policydb
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: policy-extract
      STORAGE_DIR: /app/storage/pdfs
      OPENAI_MODEL: gpt-5-nano
      ALLOW_DEV_USER_HEADER: "true"
    volumes:
      - ./backend_storage:/app/storage
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
